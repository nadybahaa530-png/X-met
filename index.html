<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X MET | منصة أحدث أفلام الأكشن والحركة المباشرة</title>
    <meta name="description" content="موقع X MET لمشاهدة وتحميل أحدث أفلام الأكشن والإثارة العالمية بجودة عالية وبث سريع بدون إعلانات.">
    <meta name="keywords" content="X MET, xmet, افلام اكشن, مشاهدة افلام, افلام حركة, سينما اكس ميت">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">X <span>MET</span></div>
        <div class="search-bar">
            <input type="text" id="searchBox" placeholder="ابحث عن فيلم أكشن أو أي فيلم آخر...">
        </div>
    </header>

    <div class="hero">
        <div class="hero-content">
            <h1>X MET ACTION</h1>
            <p>موطن الإثارة والحركة. شاهد أحدث أفلام الأكشن العالمية بجودة خارقة وسيرفرات بث ذكية.</p>
        </div>
    </div>

    <main class="container">
        <h2 class="main-title" id="pageTitle">أحدث أفلام الأكشن والإثارة 2026</h2>
        <div class="movies-grid" id="moviesGrid">
            </div>
    </main>

    <div class="cinema-overlay" id="playerModal">
        <div class="cinema-box">
            <span class="close-cinema" id="closeBtn">&times; إغلاق العرض</span>
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
